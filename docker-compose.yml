services:
  postgres:
    image: postgres:latest
    container_name: park-application-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: park
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
